name: Generate Pastel Pink Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: andreabetrina
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF5C77&color_dots=#FFF5FA,#FFE4EE,#FFC6D5,#FF9AB0,#FF5C77
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FF5C77

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
